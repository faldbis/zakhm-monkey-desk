// ---------- seeded RNG ----------
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;}}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,s)=>a+(b-a)*s;
const ease=s=>{s=clamp(s,0,1);return 1-Math.pow(1-s,3)};

// ---------- trades ----------
function genTrades(){
  const R=rng(CONFIG.seed*7919), N=CONFIG.wins+CONFIG.losses, syms=Object.keys(CONFIG.basePrices).filter(s=>s!=="BTC");
  const lossIdx=new Set(); while(lossIdx.size<CONFIG.losses) lossIdx.add(2+Math.floor(R()*(N-3)));
  const raw=[]; const last={...CONFIG.basePrices};
  for(let i=0;i<N;i++){const sym=syms[Math.floor(R()*syms.length)], side=R()<.5?"LONG":"SHORT", lev=CONFIG.leverage;
    const pct=lossIdx.has(i)? -(2+R()*2): (5+R()*28); raw.push({sym,side,lev,pct});}
  // solve scale k so compounding hits endBalance
  const sim=k=>{let b=CONFIG.startBalance;for(const t of raw){const p=t.pct>0?t.pct*k:t.pct;b+=b*0.098*p/100;}return b;};
  let lo=0.01,hi=20;for(let j=0;j<60;j++){const m=(lo+hi)/2;(sim(m)<CONFIG.endBalance?lo=m:hi=m);}
  let b=CONFIG.startBalance; const out=[];
  raw.forEach((t,i)=>{const pct=t.pct>0?t.pct*lo:t.pct; let pnl=+(b*0.098*pct/100).toFixed(2);
    if(i===raw.length-1) pnl=+(CONFIG.endBalance-b).toFixed(2);
    const entry=last[t.sym]*(1+(R()-.5)*0.004), dir=t.side==="LONG"?1:-1, exit=entry*(1+dir*pct/100/t.lev);
    last[t.sym]=exit; b+=pnl; out.push([t.sym,t.side,t.lev,entry,exit,+pct.toFixed(1),pnl]);});
  return out;
}
// trades: arrays [sym,side,lev,entry,exit,pct,pnl] (timing auto-spread) or objects from the backtest
// {sym,side,lev,entry,exit,pct,pnl,o,c,margin,fees,reason,tf,sl,tp} with o/c = minutes after 00:00 UTC
const TR=(CONFIG.trades||genTrades()).map((a,i)=>Array.isArray(a)?({n:i+1,sym:a[0],side:a[1],lev:a[2],entry:a[3],exit:a[4],pct:a[5],pnl:a[6],
  margin:Math.abs(a[6]/(a[5]/100))||CONFIG.startBalance*0.098}):Object.assign({n:i+1},a,{side:a.side==="BUY"?"LONG":a.side==="SELL"?"SHORT":a.side}));
const N=TR.length;
const STEP=(1415-25)/Math.max(1,N);
TR.forEach((t,i)=>{if(t.o===undefined){t.o=25+i*STEP; t.c=t.o+STEP*0.72;}});
// replay clock: t(seconds) -> minute of day. piecewise like the original
const TL=CONFIG.timeline||[[0,CONFIG.startMinute],[.147,297],[.368,685],[.588,932],[.809,1158],[.882,1186],[1,1440]];
function minuteAt(t){const f=t/CONFIG.replayEnd; if(f>=1) return SPAN; if(f<=0) return TL[0][1];
  for(let i=1;i<TL.length;i++) if(f<=TL[i][0]){const s=(f-TL[i-1][0])/(TL[i][0]-TL[i-1][0]);return lerp(TL[i-1][1],TL[i][1],s);} return SPAN;}
function timeAtMinute(m){for(let i=1;i<TL.length;i++) if(m<=TL[i][1]){const s=(m-TL[i-1][1])/(TL[i][1]-TL[i-1][1]);return Math.max(-1,lerp(TL[i-1][0],TL[i][0],s))*CONFIG.replayEnd;} return CONFIG.replayEnd;}
TR.forEach(t=>{t.to=timeAtMinute(t.o); t.tc=timeAtMinute(t.c); if(t.o<CONFIG.startMinute){t.to=-3+t.n*0.1; t.tc=Math.min(t.tc,0.25);} });
let acc=CONFIG.startBalance; TR.forEach(t=>{t.balBefore=acc; acc+=t.pnl; t.balAfter=acc;});
const END=acc;

// ---------- price paths (Brownian bridge through trade prices) ----------
const PATH={};
(function(){
  for(const sym of Object.keys(CONFIG.basePrices)){
    const R=rng(CONFIG.seed*31+sym.charCodeAt(0)*97+sym.charCodeAt(1));
    const anchors=[]; TR.filter(t=>t.sym===sym).forEach(t=>{anchors.push([t.o,t.entry]);anchors.push([t.c,t.exit]);});
    const p0=anchors.length?anchors[0][1]:CONFIG.basePrices[sym];
    if(!anchors.length||anchors[0][0]>0) anchors.unshift([0,p0*(1+(R()-.5)*0.01)]);
    const pl=anchors[anchors.length-1][1]; if(anchors[anchors.length-1][0]<1440) anchors.push([1441,pl*(1+(R()-.5)*0.006)]);
    const Wk=new Float32Array(1442); for(let i=1;i<1442;i++) Wk[i]=Wk[i-1]+(R()-.5)*2;
    const P=new Float32Array(1442), sig=p0*0.00095;
    for(let k=0;k<anchors.length-1;k++){const [a,pa]=anchors[k],[b,pb]=anchors[k+1]; const ia=Math.round(a), ib=Math.round(b);
      for(let m=ia;m<=Math.min(ib,1441);m++){const s=ib>ia?(m-ia)/(ib-ia):0; P[m]=lerp(pa,pb,s)+sig*(Wk[m]-lerp(Wk[ia],Wk[ib],s));}}
    PATH[sym]=P;
  }
})();
// real candles: CONFIG.candles[sym] = {t0:minute of first 3m bar (may be <0), o:[],h:[],l:[],c:[]}
const RC=CONFIG.candles||{};
function price(sym,m){const r=RC[sym]; if(!r) return PATH[sym][clamp(Math.round(m),0,1441)];
  const f=(m-r.t0)/3, i=clamp(Math.floor(f),0,r.c.length-1), s=clamp(f-i,0,1); return lerp(r.o[i],r.c[i],s);}
function candle(sym,k,mNow){ const r=RC[sym];
  if(r){const a=k*15,b=Math.min(a+15,mNow);const i0=Math.round((a-r.t0)/3);let o=null,h=-Infinity,l=Infinity,c=null;
    for(let i=i0;i<i0+5&&i<r.c.length;i++){const bs=r.t0+i*3; if(i<0||bs>=b) break; if(o===null)o=r.o[i];
      const part=bs+3>b; const cc=part?price(sym,b):r.c[i]; h=Math.max(h,part?Math.max(o,cc):r.h[i]);l=Math.min(l,part?Math.min(o,cc):r.l[i]);c=cc;}
    if(o===null){const p=price(sym,a);return {o:p,h:p,l:p,c:p};} return {o,h,l,c};} // 15m candle k, truncated at mNow
  const a=k*15, b=Math.min(k*15+15,mNow); let o=price(sym,a),c=price(sym,b),h=Math.max(o,c),l=Math.min(o,c);
  for(let m=a;m<=b;m++){const p=price(sym,m);h=Math.max(h,p);l=Math.min(l,p);} return {o,h,l,c};}
function fmtP(sym,p){ if(sym==="ETH"||sym==="BTC") return Math.round(p).toLocaleString("en-US"); if(sym==="XAU") return p.toFixed(2); if(/JPY/.test(sym)) return p.toFixed(3); if(sym.length===6) return p.toFixed(5); return p.toFixed(4);}
const fmt2=v=>v.toFixed(2);
const sgn=v=>(v>=0?"+":"-");

// ---------- state at time t ----------
function stateAt(t){
  const m=minuteAt(t);
  const closed=TR.filter(x=>x.tc<=t), opens=TR.filter(x=>x.to<=t&&x.tc>t), open=opens[0]||null;
  let bal=CONFIG.startBalance; for(const x of closed) bal+=x.pnl*ease((t-x.tc)/0.6);
  const realized=CONFIG.startBalance+closed.reduce((s,x)=>s+x.pnl,0);
  let upnl=0, upct=0, cur=null;
  for(const x of opens){const p=price(x.sym,m), d=x.side==="LONG"?1:-1, u=d*(p-x.entry)/x.entry*x.lev*100; upnl+=x.margin*u/100; if(x===open){cur=p;upct=u;}}
  const last=closed[closed.length-1]||null;
  const chartSym=open?open.sym:(last?last.sym:(TR[0]?TR[0].sym:(CONFIG.chartSym||"ETH")));
  return {t,m,closed,open,opens,bal,realized,upnl,upct,cur,last,chartSym,done:t>=CONFIG.replayEnd};
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}

function monkeyFace(x,y,r,col,lw=2){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=lw;

// ---------- agent statuses ----------
function recentEvent(S){const ev=(CONFIG.events||[]).filter(e=>e[0]<=S.m); const e=ev[ev.length-1]; if(!e||S.m-e[0]>240) return null;
  return e[2]==="armed"?`${e[1]} ${e[3]} ${e[4]==="buy"?"SELL":"BUY"} setup armed`:`${e[1]} ${e[3]} ${e[4]} zone ${fmtP(e[1],e[5])}`;}
function agentStatus(id,S){
  const t=S.t, o=S.open, L=S.last;
  if(S.done){const fin={SCOUT:"scanning the replay",CHECK:`${MULTI?"week":"day"} ${sgn(END-CONFIG.startBalance)}${Math.abs((END/CONFIG.startBalance-1)*100).toFixed(1)} %`,SIZE:`end ${money(END)}`,
    ENTRY:"replay finished",EXIT:`${N} trade${N===1?"":"s"} done`,GUARD:N?"hindsight only!":"no setup = no trade",CHIEF:MULTI?"week done!":"day done!"};return [fin[id],CONFIG.replayEnd];}
  const sym=o?o.sym:(L?L.sym:"ETH");
  const lists={
    SCOUT:CONFIG.strategyName?[recentEvent(S)||CONFIG.scoutIdle||"scanning OSMA zones"]:["scanning the replay"],
    CHECK:CONFIG.checkList?CONFIG.checkList:CONFIG.strategyName?["OSMA 132/32/16","waiting 1H close","\u201Creal candle, ok\u201D"]:["reviewing the logs","reading 15m candles","\u201Creal candle, ok\u201D"],
    SIZE:CONFIG.rMode?[o?`risk ${money(o.margin)}`:`balance ${money(S.realized)}`,`balance ${money(S.realized)}`,`\u201C${CONFIG.riskPct}% risk · ${sym}\u201D`]:[o?`margin ${fmt2(o.margin)} $`:`balance ${fmt2(S.realized)}`,`balance ${fmt2(S.realized)}`,`\u201C${o?o.lev:CONFIG.leverage}x · ${sym}\u201D`],

// =====================================================================
// AUDIO — original chiptune + SFX, generated with WebAudio.
// Works on a live AudioContext or an OfflineAudioContext (for export).
// =====================================================================
function scheduleAudio(ac,t0){
  const master=ac.createGain();master.gain.value=0.9;master.connect(ac.destination);
  const comp=ac.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(master);
  const music=ac.createGain();music.connect(comp);
  const END_T=CONFIG.replayEnd;
  // duck under the voiceover, fade at end
  music.gain.setValueAtTime(0.38,t0);music.gain.setValueAtTime(0.38,t0+5.2);music.gain.linearRampToValueAtTime(0.62,t0+6.2);
  music.gain.setValueAtTime(0.62,t0+END_T);music.gain.linearRampToValueAtTime(0.0001,t0+END_T+2.4);
  const sfx=ac.createGain();sfx.gain.value=0.5;sfx.connect(comp);
  const pulse=(()=>{const n=32,re=new Float32Array(n),im=new Float32Array(n);for(let k=1;k<n;k++)im[k]=(2/(k*Math.PI))*Math.sin(k*Math.PI*0.25);return ac.createPeriodicWave(re,im);})();
  const noiseBuf=(()=>{const b=ac.createBuffer(1,ac.sampleRate*0.5,ac.sampleRate),d=b.getChannelData(0);let s=12345;for(let i=0;i<d.length;i++){s=(s*1103515245+12345)&0x7fffffff;d[i]=s/0x3fffffff-1;}return b;})();
  const midi=n=>440*Math.pow(2,(n-69)/12);
  function tone(type,f,at,dur,vol,dest,slideTo){const o=ac.createOscillator(),g=ac.createGain();if(type==="pulse")o.setPeriodicWave(pulse);else o.type=type;
    o.frequency.setValueAtTime(f,at);if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,at+dur);
    g.gain.setValueAtTime(0.0001,at);g.gain.exponentialRampToValueAtTime(vol,at+0.005);g.gain.setValueAtTime(vol,at+dur*0.6);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
    o.connect(g);g.connect(dest);o.start(at);o.stop(at+dur+0.02);}
  function noise(at,dur,vol,hp,dest){const s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type="highpass";f.frequency.value=hp;const g=ac.createGain();
    g.gain.setValueAtTime(vol,at);g.gain.exponentialRampToValueAtTime(0.0001,at+dur);s.connect(f);f.connect(g);g.connect(dest);s.start(at);s.stop(at+dur+0.02);}
  function kick(at){const o=ac.createOscillator(),g=ac.createGain();o.type="sine";o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(42,at+0.12);
    g.gain.setValueAtTime(0.9,at);g.gain.exponentialRampToValueAtTime(0.0001,at+0.18);o.connect(g);g.connect(music);o.start(at);o.stop(at+0.2);}
  if(CONFIG.music){
    const BPM=132, beat=60/BPM, s16=beat/4, bar=beat*4;
    // A minor: Am F C G / Am F G E  (roots midi)
    const prog=[[57,[0,3,7]],[53,[0,4,7]],[48,[0,4,7]],[55,[0,4,7]],[57,[0,3,7]],[53,[0,4,7]],[55,[0,4,7]],[52,[0,4,7]]];
    // original hook (scale degrees in semitones over A4=69), 16 steps per bar, null = rest
    const hookA=[12,null,15,12, 19,null,17,15, 12,null,10,12, 15,null,null,null];
    const hookB=[12,null,15,17, 19,null,22,19, 17,null,15,17, 15,12,null,null];
    const hookC=[7,null,10,12, 15,null,12,10, 7,null,5,7, 3,null,7,null];
    const hookD=[11,null,12,14, 16,null,14,12, 11,null,8,11, 16,null,null,null];
    const hooks=[hookA,hookB,hookC,hookA,hookA,hookB,hookC,hookD];
    const bars=Math.ceil((END_T+0.5)/bar);
    for(let b=0;b<bars;b++){const T=t0+b*bar, [root,ch]=prog[b%8], intro=b<2;
      for(let s=0;s<16;s++){const at=T+s*s16; if(at>t0+END_T+0.1) break;
        // bass: octave eighths (triangle)
        if(s%2===0) tone("triangle",midi(root-12+(s%4===2?12:0)),at,s16*1.7,0.55,music);
        // arpeggio (quiet pulse)
        tone("pulse",midi(root+12+ch[s%3]+(s%6>2?12:0)),at,s16*0.8,intro?0.045:0.06,music);
        // lead hook from bar 2
        if(!intro){const n=hooks[b%8][s]; if(n!==null) tone("pulse",midi(57+n),at,s16*(hooks[b%8][s+1]===null?2.6:1.6),0.12,music);}
        // drums
        if(s%4===0) kick(at);
        if(s%8===4&&!intro) noise(at,0.14,0.35,1800,music);
        if(s%2===1) noise(at,0.035,intro?0.08:0.13,7000,music);
      }}
    // end fanfare
    const F=t0+END_T; [69,73,76,81,85,88].forEach((n,i)=>tone("pulse",midi(n),F+i*0.07,0.5,0.11,sfx));tone("triangle",midi(45),F,1.2,0.5,sfx);
  }
  // SFX per trade
  TR.forEach(t=>{
    if(t.to>=0&&t.to<END_T){const at=t0+t.to; tone("square",880,at,0.06,0.10,sfx); tone("square",1320,at+0.06,0.08,0.08,sfx);}
    if(t.tc>=0&&t.tc<=END_T){const at=t0+Math.max(0.05,t.tc);
      if(t.pnl>=0){tone("square",988,at,0.08,0.22,sfx);tone("square",1319,at+0.075,0.32,0.20,sfx);
        for(let k=0;k<6;k++) tone("square",2000+k*90,at+0.12+k*0.06,0.025,0.05,sfx); }
      else {tone("sawtooth",330,at,0.35,0.16,sfx,110);tone("square",165,at+0.05,0.3,0.08,sfx,80);}}
  });
}
async function renderAudioWav(){
  const sr=48000, len=Math.ceil(CONFIG.duration*sr), oc=new OfflineAudioContext(2,len,sr);
  scheduleAudio(oc,0); const buf=await oc.startRendering();
  const L=buf.getChannelData(0),R=buf.getChannelData(1), dv=new DataView(new ArrayBuffer(44+len*4));
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i));};
  ws(0,"RIFF");dv.setUint32(4,36+len*4,true);ws(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);dv.setUint16(32,4,true);dv.setUint16(34,16,true);ws(36,"data");dv.setUint32(40,len*4,true);
  for(let i=0;i<len;i++){dv.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);dv.setInt16(46+i*4,clamp(R[i],-1,1)*32767,true);}
  const bytes=new Uint8Array(dv.buffer);let bin="";for(let i=0;i<bytes.length;i+=0x8000) bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));
  return btoa(bin);
}
